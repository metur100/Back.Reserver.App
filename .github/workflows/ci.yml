name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, unit + SQL Server integration tests)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD || 'Ci_Only_Passw0rd!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    env:
      BACKRESERVE_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD || 'Ci_Only_Passw0rd!' }};TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore backend/BackReserve.sln
      - name: Build (warnings as errors)
        run: dotnet build backend/BackReserve.sln --no-restore -c Release -warnaserror
      - name: Unit tests
        run: dotnet test backend/BackReserve.Tests --no-build -c Release --logger trx --results-directory TestResults
      - name: Integration tests (real SQL Server)
        run: dotnet test tests/integration/BackReserve.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults
      - name: Check EF Core model has no pending migration
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes -p backend/BackReserve.Infrastructure -s backend/BackReserve.Api --no-build --configuration Release
      - name: Vulnerable NuGet packages
        run: |
          dotnet list backend/BackReserve.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults

  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (typecheck, lint, unit tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Bundle JavaScript for Android (compile check)
        run: npx expo export --platform android --output-dir dist-ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: End-to-end (Playwright against API + SQL Server)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD || 'Ci_Only_Passw0rd!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5280
      ConnectionStrings__Default: Server=localhost,1433;Database=BackReserveE2E;User Id=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD || 'Ci_Only_Passw0rd!' }};TrustServerCertificate=True
      Email__Provider: None
      Email__CaptureInDevMailbox: "true"
      RateLimiting__Enabled: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tests/e2e/package-lock.json
      - name: Start API (Development, demo data)
        run: |
          dotnet publish backend/BackReserve.Api -c Release -o .run/api
          (cd .run/api && nohup dotnet BackReserve.Api.dll > ../api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:5280/health/ready && break; sleep 2; done
          curl -sf http://localhost:5280/health/ready || (cat .run/api.log; exit 1)
      - name: Install web
        run: npm ci
        working-directory: apps/web
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: tests/e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            .run/api.log
