name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public URL of the API (MonsterASP). Not a secret.
  VITE_API_BASE_URL: https://backreserve.runasp.net
  # The site is served from https://<user>.github.io/<repo>/
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: SPA fallback for deep links (GitHub Pages has no rewrites)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          find dist -name '*.map' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
