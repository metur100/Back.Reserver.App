version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Expo SDK upgrades must be done deliberately with `npx expo install --fix`.
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
