# Local development services for BackReserve. Not intended for production.
# Ports are shifted (14333, 1026, 8026) to avoid clashing with other local projects.
name: backreserve

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Local development password only. Override via .env (see .env.example).
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-BackReserve_Dev_2026!}"
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

volumes:
  sqlserver-data:
